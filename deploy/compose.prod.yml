# Wyrhta Labs household stack — DEPLOYMENT.
#
# Pulls pinned images from GHCR; no source checkout required on the host.
#
# The development file is compose.dev.yml. The two are deliberately
# independent and must not be merged, extended, or turned into profiles.
#
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env up -d

name: wyrhta

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set it in deploy/.env}
      HEORTH_DB_PASSWORD: ${HEORTH_DB_PASSWORD:?set it in deploy/.env}
      KITH_DB_PASSWORD: ${KITH_DB_PASSWORD:?set it in deploy/.env}
      FIREFLY_DB_PASSWORD: ${FIREFLY_DB_PASSWORD:-}
    volumes:
      # Postgres 18 PGDATA is /var/lib/postgresql/<major>/docker and the
      # declared volume is one level up. Mounting /var/lib/postgresql/data
      # SILENTLY STOPS PERSISTING DATA.
      - db_data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kithledger:
    image: ghcr.io/wyrhta-labs/kithledger:${KITH_IMAGE_TAG:?pin an image tag in deploy/.env}
    environment:
      DATABASE_URL: postgres://kithledger:${KITH_DB_PASSWORD:?}@db:5432/kithledger
      JWT_SECRET: ${KITH_JWT_SECRET:?set it in deploy/.env}
      ADMIN_PASSWORD: ${KITH_ADMIN_PASSWORD:?set it in deploy/.env}
      API_PORT: 3000
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-604800}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      CORS_ORIGIN: ${KITH_CORS_ORIGIN:-*}
      # Satellite verification (ADR 0009). KithLedger only ever VERIFIES; it holds
      # no signing key and cannot mint a member token.
      HEORTH_JWKS_URL: ${HEORTH_JWKS_URL:-}
      SATELLITE_AUDIENCE: ${SATELLITE_AUDIENCE:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4002:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  heorth:
    image: ghcr.io/wyrhta-labs/heorth:${HEORTH_IMAGE_TAG:?pin an image tag in deploy/.env}
    environment:
      DATABASE_URL: postgres://heorth:${HEORTH_DB_PASSWORD:?}@db:5432/heorth
      JWT_SECRET: ${HEORTH_JWT_SECRET:?set it in deploy/.env}
      ADMIN_PASSWORD: ${HEORTH_ADMIN_PASSWORD:?set it in deploy/.env}
      ADMIN_EMAIL: ${HEORTH_ADMIN_EMAIL:?set it in deploy/.env}
      HOUSEHOLD_NAME: ${HOUSEHOLD_NAME:?set it in deploy/.env}
      API_PORT: 3000
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-604800}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      CORS_ORIGIN: ${HEORTH_CORS_ORIGIN:-*}
      M365_TENANT_ID: ${M365_TENANT_ID:-}
      M365_CLIENT_ID: ${M365_CLIENT_ID:-}
      M365_CLIENT_SECRET: ${M365_CLIENT_SECRET:-}
      M365_REDIRECT_URI: ${M365_REDIRECT_URI:-}
      M365_FAMILY_MAILBOX: ${M365_FAMILY_MAILBOX:-}
      M365_SHARED_TODO_LIST: ${M365_SHARED_TODO_LIST:-}
      # KithLedger reminders feed — both, or both blank. Partial presence
      # is a startup error.
      KITH_BASE_URL: ${KITH_BASE_URL:-}
      KITH_PUBLIC_URL: ${KITH_PUBLIC_URL:-}
      KITH_API_KEY: ${KITH_API_KEY:-}
      # Satellite identity (ADR 0002 Phase B / ADR 0009). Heorth signs short-lived
      # member tokens with this key and publishes the public half at
      # /.well-known/jwks.json. DISTINCT from JWT_SECRET, which also derives the
      # M365 refresh-token encryption key and never leaves this service.
      SATELLITE_SIGNING_KEY: ${SATELLITE_SIGNING_KEY:-}
      SATELLITE_SIGNING_KID: ${SATELLITE_SIGNING_KID:-}
      SATELLITE_SIGNING_ALG: ${SATELLITE_SIGNING_ALG:-EdDSA}
      # Only satellites named here can be minted for. Adding one is deliberate.
      SATELLITE_AUDIENCES: ${SATELLITE_AUDIENCES:-}
      # The reminders feed presents a household-kinded kl_ key (ADR 0004 §2).
      KITH_API_KEY_KIND: ${KITH_API_KEY_KIND:-}
      # Bank ingestion (ADR 0016). Firefly III is a one-way ingestion provider,
      # never the ledger. Heorth POLLS the sidecar; no inbound route, no shared
      # secret. DEFAULTS OFF. In production the personal access token is a
      # MANUAL step: log in to Firefly, Profile -> OAuth -> Personal Access
      # Tokens, paste it into deploy/.env as FIREFLY_PAT, set
      # FEOH_IMPORT_ENABLED=true, recreate heorth and firefly-importer.
      FEOH_IMPORT_ENABLED: ${FEOH_IMPORT_ENABLED:-false}
      FIREFLY_BASE_URL: ${FIREFLY_BASE_URL:-http://firefly:8080}
      FIREFLY_PAT: ${FIREFLY_PAT:-}
      FEOH_CURRENCY: ${FEOH_CURRENCY:-EUR}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  heorth-mcp:
    image: ghcr.io/wyrhta-labs/heorth-mcp:${HEORTH_MCP_IMAGE_TAG:?pin an image tag in deploy/.env}
    environment:
      # Origin only — the client appends /api/v1 itself.
      HEORTH_BASE_URL: http://heorth:3000
      # kith.* tools (task B11): no service key. heorth-mcp exchanges the
      # caller's own he_ key at Heorth for a short-lived member token
      # (ADR 0009) and presents that to KithLedger. KITH_API_KEY is gone.
      KITH_BASE_URL: http://kithledger:3000
      KITH_AUDIENCE: ${SATELLITE_AUDIENCE:-kithledger}
      PORT: 3200
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-10000}
    depends_on:
      heorth:
        condition: service_healthy
      kithledger:
        condition: service_healthy
    ports:
      - "4003:3200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Bank-ingestion sidecar (ADR 0016) — optional. Firefly talks to banks and
  # nothing else; Feoh stays the system of record. Its database is NOT in the
  # backup set on purpose: it owns no household-visible data, and a re-import
  # from the banks recreates it.
  firefly:
    image: fireflyiii/core:version-6.6.6
    environment:
      APP_KEY: ${FIREFLY_APP_KEY:?exactly 32 characters, set it in deploy/.env}
      APP_URL: ${FIREFLY_APP_URL:?the URL the operator's browser uses}
      TRUSTED_PROXIES: "**"
      SITE_OWNER: ${HEORTH_ADMIN_EMAIL:?set it in deploy/.env}
      TZ: ${TZ:-Europe/Berlin}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD:?set it in deploy/.env}
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4001:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  firefly-importer:
    image: fireflyiii/data-importer:version-1.9.1
    environment:
      FIREFLY_III_URL: http://firefly:8080
      VANITY_URL: ${FIREFLY_APP_URL:?the URL the operator's browser uses}
      FIREFLY_III_ACCESS_TOKEN: ${FIREFLY_PAT:-}
      TRUSTED_PROXIES: "**"
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - firefly_importer_config:/var/www/html/storage/configurations
    depends_on:
      firefly:
        condition: service_started
    ports:
      - "4004:8080"
    restart: unless-stopped

  db-backup:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set it in deploy/.env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ONCE: ${BACKUP_ONCE:-false}
    volumes:
      - db_backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  db_backups:
  firefly_upload:
  firefly_importer_config:
