# Wyrhta Labs household stack — DEVELOPMENT.
#
# Builds every service from its sibling checkout, so Heorth/ and
# KithLedger/ must be cloned beside this repo. The deployment file is
# compose.prod.yml; the two are deliberately independent and must not be
# merged, extended, or turned into profiles.
#
#   docker compose -f deploy/compose.dev.yml --env-file deploy/.env up -d
#
# Host ports deliberately live in the 14xxx/15432 range so this stack does not
# fight per-service defaults, unrelated local services, or Windows reserved
# port ranges. Container-internal ports stay conventional.

name: wyrhta-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set it in deploy/.env}
      HEORTH_DB_PASSWORD: ${HEORTH_DB_PASSWORD:?set it in deploy/.env}
      KITH_DB_PASSWORD: ${KITH_DB_PASSWORD:?set it in deploy/.env}
      # Firefly's role and databases (ADR 0016). Only read by initdb, and only
      # on an EMPTY volume — on an existing dev cluster deploy/dev-up.sh
      # creates them instead, which is the manual step deploy/README.md
      # documents for adding a service to a live cluster.
      FIREFLY_DB_PASSWORD: ${FIREFLY_DB_PASSWORD:-}
      CREATE_TEST_DATABASES: "true"
    volumes:
      # Postgres 18 sets PGDATA to /var/lib/postgresql/<major>/docker and
      # declares its volume one level up. Mounting /var/lib/postgresql/data
      # makes the container start against an anonymous volume and SILENTLY
      # STOP PERSISTING DATA.
      - db_data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kithledger:
    build: ../KithLedger
    environment:
      # DEV USES THE _dev DATABASE ON PURPOSE. The service repos' test suites
      # refuse to run against a DATABASE_URL containing "_dev" and truncate every
      # table otherwise, so naming dev data *_dev is what protects it from a
      # stray `npm test`. Prod (compose.prod.yml) uses the primary database.
      DATABASE_URL: postgres://kithledger:${KITH_DB_PASSWORD:?}@db:5432/kithledger_dev
      JWT_SECRET: ${KITH_JWT_SECRET:?set it in deploy/.env}
      ADMIN_PASSWORD: ${KITH_ADMIN_PASSWORD:?set it in deploy/.env}
      API_PORT: 3000
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-604800}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      CORS_ORIGIN: "*"
      # Satellite verification (ADR 0009). KithLedger only ever VERIFIES; it holds
      # no signing key and cannot mint a member token.
      HEORTH_JWKS_URL: ${HEORTH_JWKS_URL:-}
      SATELLITE_AUDIENCE: ${SATELLITE_AUDIENCE:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "14002:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  heorth:
    build: ../Heorth
    environment:
      # _dev on purpose — see the note on the kithledger service above.
      DATABASE_URL: postgres://heorth:${HEORTH_DB_PASSWORD:?}@db:5432/heorth_dev
      JWT_SECRET: ${HEORTH_JWT_SECRET:?set it in deploy/.env}
      ADMIN_PASSWORD: ${HEORTH_ADMIN_PASSWORD:?set it in deploy/.env}
      ADMIN_EMAIL: ${HEORTH_ADMIN_EMAIL:?set it in deploy/.env}
      HOUSEHOLD_NAME: ${HOUSEHOLD_NAME:?set it in deploy/.env}
      API_PORT: 3000
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-604800}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      CORS_ORIGIN: "*"
      # All six, or all blank. Partial presence is a startup error.
      M365_TENANT_ID: ${M365_TENANT_ID:-}
      M365_CLIENT_ID: ${M365_CLIENT_ID:-}
      M365_CLIENT_SECRET: ${M365_CLIENT_SECRET:-}
      M365_REDIRECT_URI: ${M365_REDIRECT_URI:-}
      M365_FAMILY_MAILBOX: ${M365_FAMILY_MAILBOX:-}
      M365_SHARED_TODO_LIST: ${M365_SHARED_TODO_LIST:-}
      # KithLedger reminders feed — both, or both blank. Partial presence
      # is a startup error.
      KITH_BASE_URL: ${KITH_BASE_URL:-}
      KITH_PUBLIC_URL: ${KITH_PUBLIC_URL:-}
      KITH_API_KEY: ${KITH_API_KEY:-}
      # Satellite identity (ADR 0002 Phase B / ADR 0009). Heorth signs short-lived
      # member tokens with this key and publishes the public half at
      # /.well-known/jwks.json. DISTINCT from JWT_SECRET, which also derives the
      # M365 refresh-token encryption key and never leaves this service.
      SATELLITE_SIGNING_KEY: ${SATELLITE_SIGNING_KEY:-}
      SATELLITE_SIGNING_KID: ${SATELLITE_SIGNING_KID:-}
      SATELLITE_SIGNING_ALG: ${SATELLITE_SIGNING_ALG:-EdDSA}
      # Only satellites named here can be minted for. Adding one is deliberate.
      SATELLITE_AUDIENCES: ${SATELLITE_AUDIENCES:-}
      # The reminders feed presents a household-kinded kl_ key (ADR 0004 §2).
      KITH_API_KEY_KIND: ${KITH_API_KEY_KIND:-}
      # Bank ingestion (ADR 0016). Firefly III is a one-way ingestion provider,
      # never the ledger — Feoh stays the system of record. Heorth POLLS the
      # sidecar; there is no inbound route and no shared secret.
      #
      # DEFAULTS OFF, and stays off until FIREFLY_PAT is filled. Firefly mints
      # personal access tokens through its web UI only (Profile -> OAuth ->
      # Personal Access Tokens); there is no non-interactive path, so this is
      # the one value deploy/dev-up.sh cannot generate for you. Off means the
      # scheduler does not start; reading the inbox, maintaining rules and
      # confirming pending rows keep working — they are pure Feoh writes.
      FEOH_IMPORT_ENABLED: ${FEOH_IMPORT_ENABLED:-false}
      FIREFLY_BASE_URL: ${FIREFLY_BASE_URL:-http://firefly:8080}
      FIREFLY_PAT: ${FIREFLY_PAT:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "14000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  heorth-mcp:
    build: ../heorth-mcp
    environment:
      # Origin only — the client appends /api/v1 itself.
      HEORTH_BASE_URL: http://heorth:3000
      # kith.* tools (task B11): no service key. heorth-mcp exchanges the
      # caller's own he_ key at Heorth for a short-lived member token
      # (ADR 0009) and presents that to KithLedger. KITH_API_KEY is gone.
      KITH_BASE_URL: http://kithledger:3000
      KITH_AUDIENCE: ${SATELLITE_AUDIENCE:-kithledger}
      PORT: 3200
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-10000}
    depends_on:
      heorth:
        condition: service_healthy
      kithledger:
        condition: service_healthy
    ports:
      - "14003:3200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # --- Bank ingestion sidecar (ADR 0016) ------------------------------------
  #
  # Firefly III's ONLY job here is talking to banks: PSD2 enrolment, CAMT.053
  # and per-bank quirks. Its budgets, bills, rules engine and reconciliation
  # are unused, and its web UI is an OPERATOR tool for connecting banks — never
  # a household surface, which is why its one-user-per-administration limit
  # never surfaces. Heorth reads it through a two-method, read-only ingestion
  # provider and books what it can into Feoh.
  #
  # NOTHING DEPENDS ON THESE TWO. `heorth` deliberately has no depends_on here:
  # Firefly being down pauses the import and nothing else. Neither service
  # appears in compose.demo.yml (ADR 0012 — a demo reaches no external system;
  # seed-demo.mjs fills the import inbox directly instead).
  firefly:
    image: fireflyiii/core:version-6.6.6
    environment:
      # Exactly 32 characters. Firefly refuses to boot otherwise.
      # deploy/dev-up.sh generates it.
      APP_KEY: ${FIREFLY_APP_KEY:?set it in deploy/.env — run deploy/dev-up.sh}
      # Must match the URL the browser uses, or Firefly answers "invalid host".
      APP_URL: ${FIREFLY_APP_URL:-http://localhost:14001}
      TRUSTED_PROXIES: "**"
      SITE_OWNER: ${HEORTH_ADMIN_EMAIL:?set it in deploy/.env}
      TZ: ${TZ:-Europe/Berlin}
      # Its own role and database in the shared cluster. _dev on purpose, like
      # every other dev database here.
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: firefly_dev
      DB_USERNAME: firefly
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD:?set it in deploy/.env — run deploy/dev-up.sh}
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "14001:8080"
    healthcheck:
      # curl, NOT wget: the image is Debian-based and ships curl only. Firefly
      # runs its migrations on first boot, hence the long start_period.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  firefly-importer:
    image: fireflyiii/data-importer:version-1.9.1
    environment:
      # Where the importer TALKS to Firefly (compose network) vs. where it
      # sends the operator's BROWSER (published host port). Both are needed.
      FIREFLY_III_URL: http://firefly:8080
      VANITY_URL: ${FIREFLY_APP_URL:-http://localhost:14001}
      # Blank until an operator mints one in Firefly's UI. The importer starts
      # either way and asks for a token on its first screen.
      FIREFLY_III_ACCESS_TOKEN: ${FIREFLY_PAT:-}
      TRUSTED_PROXIES: "**"
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - firefly_importer_config:/var/www/html/storage/configurations
    depends_on:
      firefly:
        condition: service_started
    ports:
      - "14004:8080"
    # No healthcheck: this is an operator UI that nothing waits on, and an
    # unverified probe expression would only hang deploy/dev-up.sh.
    restart: unless-stopped

  db-backup:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set it in deploy/.env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ONCE: ${BACKUP_ONCE:-false}
    volumes:
      - db_backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  db_backups:
  firefly_upload:
  firefly_importer_config:
